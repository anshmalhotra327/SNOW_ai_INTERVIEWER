<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNOW — Your AI Interviewer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-white text-slate-800 min-h-screen">

<div class="max-w-3xl mx-auto px-4 py-10">

  <header class="text-center mb-12">
    <div class="logo-wrap">
      <span class="logo-flake">❄</span>
      <h1 class="logo-text">SNOW</h1>
    </div>
    <p class="tagline-text mt-2">Your AI Interviewer</p>
    <div id="intro-status" class="mt-4 text-sm text-slate-400 min-h-[1.25rem]"></div>
    <p id="speech-caption" class="mt-4 text-lg font-medium caption-text min-h-[2rem]"></p>
  </header>

  <!-- STAGE: UPLOAD + NAME (revealed after intro speech) -->
  <section id="stage-upload" class="panel-card hidden">
    <h2 class="text-xl font-semibold mb-4">Let's get started</h2>
    <input id="candidate-name-input" type="text" placeholder="Your name"
           class="w-full mb-4 px-4 py-3 rounded-xl bg-white border border-slate-200 text-slate-800 placeholder-slate-400 name-input">
    <label for="resume-input" class="upload-drop">
      <span id="upload-label-text">📄 Click to select a PDF resume</span>
      <input type="file" id="resume-input" accept="application/pdf" class="hidden">
    </label>
    <button id="upload-btn" class="btn-primary mt-5 w-full" disabled>Process Resume</button>
    <div id="upload-status" class="mt-4 text-sm text-slate-400"></div>
  </section>

  <!-- STAGE: VERIFYING (open, no box) -->
  <section id="stage-verify" class="open-stage hidden text-center">
    <h2 class="text-xl font-semibold mb-6">Mic & Setup Check</h2>
    <div class="mic-badge" id="verify-mic-badge">
      <div class="mic-pulse"></div>
      <span>🎙️</span>
      <div class="wave-bars"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <p class="mt-8 text-slate-500">Please say:</p>
    <p class="text-lg font-medium mt-1">"Start now"</p>
    <p id="verify-heard-text" class="mt-4 text-sm text-slate-400 min-h-[1.5rem]"></p>
    <p id="verify-feedback" class="mt-2 text-sm"></p>
  </section>

  <!-- STAGE: INTERVIEW (open, no box) -->
  <section id="stage-interview" class="open-stage hidden">
    <div class="flex justify-between items-center mb-6">
      <span class="text-sm text-slate-500">Question <span id="q-current">1</span> / 3</span>
      <div class="mic-badge-small" id="interview-mic-badge">
        <div class="mic-pulse-small"></div>
        <span>🎙️</span>
      </div>
    </div>
    <div class="progress-track mb-8">
      <div id="progress-bar" class="progress-fill"></div>
    </div>
    <p id="question-text" class="text-xl font-medium mb-4 text-center">-</p>
    <div id="interview-state-label" class="text-sm text-slate-500 mb-3 text-center">AI is speaking...</div>
    <p id="live-transcript" class="text-slate-600 min-h-[3rem] text-center px-4"></p>
  </section>

  <!-- STAGE: RESULTS -->
  <section id="stage-results" class="panel-card hidden">
    <h2 class="text-xl font-semibold mb-4">Evaluation Report</h2>
    <div class="flex items-center gap-4 mb-6">
      <div id="score-circle" class="score-circle">--</div>
      <div>
        <div class="text-slate-500 text-sm">Overall Score</div>
        <div id="candidate-name-result" class="text-lg font-semibold"></div>
      </div>
    </div>
    <div class="result-block">
      <h3>Strengths</h3>
      <p id="result-strengths"></p>
    </div>
    <div class="result-block">
      <h3>Technical Accuracy</h3>
      <p id="result-technical"></p>
    </div>
    <div class="result-block">
      <h3>Feedback Summary</h3>
      <p id="result-feedback"></p>
    </div>
    <div class="mt-6">
      <h3 class="font-semibold mb-2 gradient-text">Full Transcript</h3>
      <div id="result-transcript" class="space-y-3"></div>
    </div>
  </section>

</div>

<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
